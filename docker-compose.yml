services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fpsc
      POSTGRES_USER: fpsc
      POSTGRES_PASSWORD: fpsc_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: fpsc-dev-secret-change-in-production
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://fpsc:fpsc_dev@db:5432/fpsc
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - db
      - redis

  celery:
    build: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SECRET_KEY: fpsc-dev-secret-change-in-production
      DATABASE_URL: postgres://fpsc:fpsc_dev@db:5432/fpsc
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend

  frontend:
    build: ./frontend
    command: npm run dev -- -H 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
  media_data:
